<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realmwalker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Title Screen -->
    <div id="titleScreen">

        <h1>Realmwalker</h1>

        <p>
            Journey through the Nine Realms of Norse mythology.
            Every decision matters. Will you survive?
        </p>

        <button id="startButton">Begin Adventure</button>

    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">

        <h1>Realmwalker</h1>

        <div id="stats">
            ❤️ Health:
            <span id="health">100</span>

            &nbsp;&nbsp;&nbsp;

            🌍 Realm:
            <span id="realmNumber">1</span>/9
        </div>

        <div id="encounter">

            <h2 id="realmName">
                Asgard
            </h2>

            <p id="story">
                Press Begin Adventure to start your journey.
            </p>

        </div>

        <div id="choices">

            <button id="choice1"></button>

            <button id="choice2"></button>

        </div>

        <!-- Dice Roll -->

        <div id="diceArea" class="hidden">

            <h2>🎲 Rolling...</h2>

            <div id="diceRoll">
                1
            </div>

            <p id="chanceText"></p>

        </div>

        <!-- Result -->

        <div id="resultArea" class="hidden">

            <h2 id="resultTitle"></h2>

            <p id="resultText"></p>

            <button id="continueButton">
                Continue
            </button>

        </div>

        <!-- Ending -->

        <div id="ending" class="hidden">

            <h2 id="endingTitle"></h2>

            <p id="endingText"></p>

            <button onclick="location.reload()">
                Play Again
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
